# Production stack: Postgres + API + web (nginx) + nightly backups.
# Put a TLS reverse proxy (Caddy, Traefik or your load balancer) in front of "web".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CRM_DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD}@db:5432/crm
    volumes:
      - ./backups:/backups:ro  # lets the System status page and MetricsHub check the nightly backups
    depends_on:
      db:
        condition: service_healthy
    # 503 when the database is unreachable, background jobs stopped or backups are missing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U crm -d crm -Fc -f /backups/crm-$$(date +%Y%m%d-%H%M).dump &&
        find /backups -name "crm-*.dump" -mtime +${BACKUP_RETENTION_DAYS:-14} -delete;
        sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
